[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sweettv-tvrec"
version = "0.1.0"
description = "Reproducible temporal TV recommendation experiments"
requires-python = ">=3.10"
dependencies = [
    "numpy==1.24.2",
    "pandas==1.5.3",
    "pyarrow==22.0.0",
    "tzdata==2024.1",
    "psutil==5.9.4",
]

[project.scripts]
tvrec = "tvrec.__main__:main"

[tool.setuptools.packages.find]
include = ["tvrec*"]
